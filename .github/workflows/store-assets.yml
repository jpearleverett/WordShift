name: Store asset review package

# Explicitly run by the owner in a supported capture environment. This workflow
# is not a store publisher and is not triggered by routine source pushes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Install capture and video dependencies
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Produce review assets
        run: npm run store:refresh
      - name: Retain generated review and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: wordshift-store-review
          path: |
            mobile/store-output/*.zip
            mobile/assets/Play_store/launch-2026-09-v2/raw/
            mobile/assets/Play_store/launch-2026-09-v2/review/
            mobile/assets/Play_store/launch-2026-09-v2/source/layouts/
            mobile/assets/Play_store/launch-2026-09-v2/manifest.json
            mobile/assets/Play_store/launch-2026-09-v2/preview.html
            mobile/assets/Play_store/launch-2026-09-v2/upload/
            mobile/assets/Play_store/launch-2026-09-v2/variants/
          retention-days: 14
