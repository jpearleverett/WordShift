name: Deploy docs to Pages

# Publishes the docs/ folder (privacy policy / terms / data-deletion pages) to
# GitHub Pages. Replaces GitHub's built-in "Deploy from a branch" flow so a
# Pages deploy only runs when docs/ actually changes — ordinary app-code merges
# no longer trigger (and intermittently fail) a Pages deployment.
#
# One-time setup: Settings > Pages > Build and deployment > Source must be set
# to "GitHub Actions" for this workflow's deploy step to publish.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize Pages deployments; do not cancel an in-flight production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The legal pages carry owner-to-complete placeholders inside HTML
      # comments until they are filled in; a placeholder that escapes its
      # comment must never reach the live site.
      - name: Refuse unfilled legal placeholders
        run: |
          status=0
          for f in $(find docs -name '*.md'); do
            if ! perl -0777 -ne 's/<!--.*?-->//gs; exit 1 if /\[(GOVERNING JURISDICTION|VENUE)/' "$f"; then
              echo "Unfilled legal placeholder outside an HTML comment in $f; fill it in before publishing." >&2
              status=1
            fi
          done
          exit $status

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
