name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    timeout-minutes: 30
    name: Typecheck, Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Test
        run: npm test -- --no-coverage --ci --runInBand

      - name: Resolved production Expo config
        # The real CLI path through app.config.js for the channel an EAS
        # production build uses: the production runtime, live ad units, an
        # inert creator kit. productionConfig.test.ts covers the same
        # invariants in-process; this step proves the CLI resolves them too.
        env:
          WORDSHIFT_RELEASE_CHANNEL: production
        run: |
          npx expo config --type public --json > "$RUNNER_TEMP/expo-config-production.json"
          node - "$RUNNER_TEMP/expo-config-production.json" <<'NODE'
          const config = require(process.argv[2]);
          const expected = `${config.version}-production`;
          const failures = [];
          if (config.runtimeVersion !== expected) failures.push(`runtimeVersion ${config.runtimeVersion} != ${expected}`);
          if (config.extra.adsUseTestIds !== false) failures.push(`adsUseTestIds must resolve false on production (got ${config.extra.adsUseTestIds})`);
          if (config.extra.creatorCode !== '') failures.push('creatorCode must stay empty in a shipping configuration');
          if (config.name !== 'WordShift') failures.push(`app name ${config.name} != WordShift`);
          if (failures.length) { console.error(failures.join('\n')); process.exit(1); }
          console.log(`production config OK: ${config.name} ${config.runtimeVersion}, adsUseTestIds=${config.extra.adsUseTestIds}`);
          NODE

      - name: Reverse top-up composition regressions
        run: npm test -- --no-coverage --ci --runInBand --config scripts/jest.config.js --runTestsByPath scripts/reverseTopUpCandidates.test.ts

      - name: Story corpus integrity
        run: node scripts/tools/auditStoryCorpus.mjs

      - name: Puzzle delivery policy and daily cohort
        run: |
          node --max-old-space-size=180 scripts/tools/auditVocabulary.mjs --branching --minimum-eligible=100
          node --max-old-space-size=180 scripts/tools/auditBankRoutes.mjs
          node scripts/tools/updateDailyBoardVersion.mjs --check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Rendered game journeys
        id: browser_tests
        run: npm run test:e2e

      - name: Upload browser evidence
        if: ${{ !cancelled() && (steps.browser_tests.outcome == 'success' || steps.browser_tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v6
        with:
          name: rendered-game-journeys
          path: |
            mobile/playwright-report/
            mobile/test-results/
          retention-days: 14
