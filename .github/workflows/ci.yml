name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    timeout-minutes: 30
    name: Typecheck, Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Test
        run: npm test -- --no-coverage --ci --runInBand

      - name: Reverse top-up composition regressions
        run: npm test -- --no-coverage --ci --runInBand --config scripts/jest.config.js --runTestsByPath scripts/reverseTopUpCandidates.test.ts

      - name: Story corpus integrity
        run: node scripts/tools/auditStoryCorpus.mjs

      - name: Puzzle delivery policy and daily cohort
        run: |
          node --max-old-space-size=180 scripts/tools/auditVocabulary.mjs --branching --minimum-eligible=100
          node --max-old-space-size=180 scripts/tools/auditBankRoutes.mjs
          node scripts/tools/updateDailyBoardVersion.mjs --check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Rendered game journeys
        run: npm run test:e2e

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-game-journeys
          path: |
            mobile/playwright-report/
            mobile/test-results/
          retention-days: 14
