title: WordShift
description: Legal pages for the WordShift mobile game — privacy policy, terms of service, and data deletion.
theme: jekyll-theme-minimal

# This directory is BOTH the GitHub Pages source and the repo's internal docs
# folder, so anything left un-excluded is served publicly at
# https://jpearleverett.github.io/WordShift/<NAME>. Only four pages are meant
# to be public: index (/), privacy-policy/, terms/, data-deletion/ — the three
# legal URLs are wired into the app (src/constants/links.ts) and the store
# listing, so never exclude or rename them.
#
# Everything below is internal and was previously live to anyone who guessed or
# search-indexed the URL. These docs describe the cult reveal, the shadow figure
# and the whole phase arc in detail — publishing them next to the link players
# tap from Settings spoils the entire game. The press kit carries the
# creator-kit fast-forward instructions (era=reveal), the checklists list
# unfinished work, and review-2026-09-06/ holds dark-phase screenshots.
#
# ADD EVERY NEW INTERNAL DOC HERE. An un-excluded file publishes silently.
exclude:
  - BACKEND_SETUP.md
  - COMPLETION_CHECKLIST.md
  - GROWTH_STRATEGY.md
  - LAUNCH_CHECKLIST.md
  - MONETIZATION_SETUP.md
  - OTA_UPDATES.md
  - PRESS_KIT.md
  - STORE_LISTING.md
  - supabase/
  - ANALYTICS_DELIVERY.md
  - SAVE_INTEGRITY_UPGRADE.md
  - STORY_AND_VISUAL_IMPLEMENTATION.md
  - STORY_PLAYTEST_PROTOCOL.md
  - SUPPORT_AND_RETENTION_RUNBOOK.md
  - VOCABULARY_AUDIT_2026-09-05.md
  - reports/
  - device-evidence/
  - VOCABULARY_EDITORIAL_DECISIONS_2026-09-06.md
  - PUZZLE_BANK_TOP_UP_2026-09-06.md
  - review-2026-09-06/
  - CURRENT_BUILD.md
  - BUILD_AND_UPLOAD.md
  - LAUNCH_READINESS_REVIEW_2026-09-14.md
