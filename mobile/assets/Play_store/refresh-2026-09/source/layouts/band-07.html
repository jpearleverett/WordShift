<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>WordShift store band 07</title><style>@font-face{font-family:'WS Figtree';src:url('../../../../fonts/Figtree-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:block}@font-face{font-family:'WS Epunda';src:url('../../../../fonts/EpundaSlab-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:block}@font-face{font-family:'WS Epunda';src:url('../../../../fonts/EpundaSlab-Italic.ttf') format('truetype');font-weight:400;font-style:italic;font-display:block}@font-face{font-family:'WS Figtree';src:url('../../../../fonts/Figtree-Regular.ttf') format('truetype');font-weight:400;font-style:normal;font-display:block}*{box-sizing:border-box}html,body{margin:0;padding:0}body{position:relative;overflow:hidden}body{width:1080px;height:360px}
