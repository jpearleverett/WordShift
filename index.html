
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>WordShift</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Nunito', sans-serif;
        background-color: #FFF0F5;
        color: #475569;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      
      /* Candy Gradient Background */
      .bg-candy {
        background: linear-gradient(135deg, #FF9A9E 0%, #FECFEF 99%, #FECFEF 100%);
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
      }

      /* Floating Bubbles */
      .bubble {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.3);
        box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.5);
        animation: floatUp infinite linear;
      }
      .b-1 { width: 100px; height: 100px; left: 10%; bottom: -100px; animation-duration: 15s; }
      .b-2 { width: 60px; height: 60px; left: 30%; bottom: -60px; animation-duration: 10s; animation-delay: 2s; }
      .b-3 { width: 150px; height: 150px; left: 70%; bottom: -150px; animation-duration: 20s; animation-delay: 1s; }
      .b-4 { width: 80px; height: 80px; left: 90%; bottom: -80px; animation-duration: 12s; animation-delay: 5s; }

      @keyframes floatUp {
        0% { transform: translateY(0) rotate(0deg); opacity: 0; }
        10% { opacity: 0.6; }
        90% { opacity: 0.6; }
        100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
      }

      /* Pop In Animation with bounce */
      @keyframes popIn {
        0% { transform: scale(0.3); opacity: 0; }
        50% { transform: scale(1.1); opacity: 1; }
        70% { transform: scale(0.9); }
        100% { transform: scale(1); opacity: 1; }
      }
      
      .animate-pop {
        animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }

      /* Scrollbar hiding */
      ::-webkit-scrollbar {
        width: 0px;
        background: transparent;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "uuid": "https://esm.sh/uuid@^13.0.0"
  }
}
</script>
</head>
  <body>
    <div class="bg-candy">
      <div class="bubble b-1"></div>
      <div class="bubble b-2"></div>
      <div class="bubble b-3"></div>
      <div class="bubble b-4"></div>
    </div>
    <div id="root"></div>
  </body>
</html>
